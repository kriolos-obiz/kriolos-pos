name: Java CI

on:
  push:
    branches: [ main, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        #os: [ubuntu-latest, macOS-latest, windows-latest]
        os: [ubuntu-latest]
        java: [17, 26]
      fail-fast: false
      max-parallel: 4
    name: Test JDK ${{ matrix.java }}, ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: 'maven'

    # Instala o servidor gráfico virtual e bibliotecas gráficas X11 para Swing/AWT no Linux
    - name: Install GUI Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libxi6 libxtst6 libxrender1

    - name: Make mvnw executable
      run: |
           if [ "$RUNNER_OS" == "Linux" ]; then
              chmod +x ./mvnw
           elif [ "$RUNNER_OS" == "macOS" ]; then
              chmod +x ./mvnw
           else
              echo "$RUNNER_OS not need change permission"
           fi
      shell: bash

    # Executa os testes usando xvfb-run com buffer 24-bit TrueColor no Linux
    - name: Run tests and collect coverage
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" ./mvnw test -Pqa -B --no-transfer-progress
        else
          ./mvnw test -Pqa -B --no-transfer-progress
        fi
      shell: bash

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5

