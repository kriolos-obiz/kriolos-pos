name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        #os: [ubuntu-latest, macOS-latest, windows-latest]
        os: [ubuntu-latest]
        java: [17, 26]
      fail-fast: false
      max-parallel: 4
    name: Test JDK ${{ matrix.java }}, ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: 'maven'

    # Install virtual framebuffer and X11 graphics libraries for Swing/AWT execution on Linux
    - name: Install GUI Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libxi6 libxtst6 libxrender1

    # Grant execution permissions to the Maven Wrapper script based on the running OS
    - name: Make mvnw executable
      run: |
           if [ "$RUNNER_OS" == "Linux" ]; then
              chmod +x ./mvnw
           elif [ "$RUNNER_OS" == "macOS" ]; then
              chmod +x ./mvnw
           else
              echo "$RUNNER_OS does not require permission changes"
           fi
      shell: bash

    # Run tests using xvfb-run with 24-bit TrueColor buffer on Linux
    - name: Run tests and collect coverage
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" ./mvnw test -Pqa -B --no-transfer-progress
        else
          ./mvnw test -Pqa -B --no-transfer-progress
        fi
      shell: bash

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

    # Collect and archive raw Allure report results for post-test analysis and auditing
    - name: Upload Allure Results Artifact
      if: always() # Ensures that test failure evidence is safely preserved even when builds fail
      uses: actions/upload-artifact@v4
      with:
        name: allure-results-jdk${{ matrix.java }}
        path: target/allure-results
        retention-days: 5
