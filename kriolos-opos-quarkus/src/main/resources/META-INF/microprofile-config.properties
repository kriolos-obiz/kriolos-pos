# ── Quarkus Framework & Desktop Swing Build-Time Extension Configuration ───────
#
# Architectural Decision: Low-level Quarkus framework build-time extension settings
# are maintained here (META-INF/microprofile-config.properties) to cleanly isolate
# build-time extension flags from high-level application runtime configuration
# in application.properties.
#

# ── Quarkus Desktop Swing Extension (io.quarkiverse.desktop:quarkus-desktop-swing)
# Set default Look-and-Feel on EDT before DesktopStartupEvent fires:
quarkus.desktop.swing.look-and-feel=com.formdev.flatlaf.FlatDarkLaf

# Include JDK Swing/AWT class properties in GraalVM native image (for JavaBeans)
quarkus.desktop.swing.java-beans.jdk-classes=true

# Auto-exit Quarkus when the last Swing window is disposed
quarkus.desktop.awt.exit-on-last-window-closed=true

# ── ArC CDI 4.0 Lite ───────────────────────────────────────────────────────────
# Retain hardware & service SPI provider beans discovered via ServiceLoader / CDI
quarkus.arc.remove-unused-beans=false

# ── JDBC Driver Extensions ─────────────────────────────────────────────────────
# KriolOS POS manages JDBC connections dynamically via Session / BootstrapConfig;
# disable automatic DevServices testcontainer provisioning.
quarkus.datasource.devservices.enabled=false

# ── Quarkus Liquibase Extension ────────────────────────────────────────────────
# Migrations are executed programmatically by com.openbravo.pos.data.DBMigrator
# at runtime upon database selection; disable automated migration on boot.
quarkus.liquibase.migrate-at-start=false
quarkus.liquibase.change-log=pos_liquidbase/db-changelog-master.xml

# Enable Foreign Function & Memory API native access in runner jar manifest
quarkus.package.jar.manifest.attributes."Enable-Native-Access"=ALL-UNNAMED

# ── GraalVM Native Image Build Configuration ──────────────────────────────────
# Defer missing optional library references to runtime errors instead of failing build-time linking.
quarkus.native.report-errors-at-runtime=true
