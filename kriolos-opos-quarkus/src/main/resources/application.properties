# ── KriolOS POS — Application Configuration ──────────────────────────────────
#
# Quarkus platform version: 3.40.1
# Note: Low-level Quarkus framework & desktop swing build-time extension flags
# (such as quarkus.desktop.swing.*, quarkus.arc.*, quarkus.datasource.devservices.*,
# and quarkus.liquibase.*) are isolated in META-INF/microprofile-config.properties
# so as not to mix low-level build-time framework settings directly with application configuration.
#

# ── Application ───────────────────────────────────────────────────────────────
quarkus.application.name=kriolos-pos
quarkus.banner.enabled=false

# ── Logging Configuration (JUL routed via JBoss LogManager) ───────────────────
quarkus.log.console.format=%d{HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.file.enable=true
quarkus.log.file.path=logs/kriolos-pos.log
quarkus.log.file.format=%d{HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.file.level=INFO
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=5

# ── Dev Mode ──────────────────────────────────────────────────────────────────
%dev.quarkus.log.level=DEBUG
%dev.quarkus.log.file.enable=true
%dev.quarkus.log.file.path=logs/kriolos-pos-dev.log
%dev.quarkus.log.file.level=DEBUG
%dev.quarkus.log.file.format=%d{HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n
%dev.quarkus.log.category."com.openbravo".level=DEBUG
%dev.quarkus.log.category."io.quarkiverse.desktop".level=DEBUG
