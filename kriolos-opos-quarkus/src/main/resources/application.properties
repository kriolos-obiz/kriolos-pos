# ── KriolOS POS — Quarkus Desktop Swing Configuration ─────────────────────────
#
# Managed by quarkus-desktop-swing (io.quarkiverse.desktop:quarkus-desktop-swing:0.2.1)
# Quarkus platform version: 3.40.1
#
# NOTE: Native image reflection (@RegisterForReflection), resource bundles
# (@RegisterResourceBundle), and classpath resource globs (@RegisterResources)
# are configured in code in io.github.kriolos.opos.quarkus.NativeReflectionConfiguration.

# ── Application ───────────────────────────────────────────────────────────────
quarkus.application.name=kriolos-pos
quarkus.banner.enabled=false
quarkus.log.console.format=%d{HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n

# ── Quarkus Desktop Swing ──────────────────────────────────────────────────────
# Look-and-Feel: set by the extension on EDT BEFORE DesktopStartupEvent fires.
# Allowed values: system | cross-platform | metal | nimbus | gtk | <FQCN>
# FlatLaf Dark — matches the existing FlatLaf module used by kriolos-opos-ui-flatlaf
quarkus.desktop.swing.look-and-feel=com.formdev.flatlaf.FlatDarkLaf

# Include JDK Swing/AWT class properties in GraalVM native image (for JavaBeans)
quarkus.desktop.swing.java-beans.jdk-classes=true

# Auto-exit the Quarkus process when the last Swing window is disposed
quarkus.desktop.awt.exit-on-last-window-closed=true

# ── ArC CDI ───────────────────────────────────────────────────────────────────
# Keep hardware SPI provider beans found via ServiceLoader / Instance<T>
quarkus.arc.remove-unused-beans=false

# ── JDBC Extensions ───────────────────────────────────────────────────────────
# KriolOS POS manages JDBC connections via its own Session / BootstrapConfig;
# disable automatic DevServices container provisioning for JDBC extensions.
quarkus.datasource.devservices.enabled=false

# ── Liquibase Extension ───────────────────────────────────────────────────────
# Migrations are executed programmatically by com.openbravo.pos.data.DBMigrator
# at runtime upon database selection; disable automated migration on boot.
quarkus.liquibase.migrate-at-start=false
quarkus.liquibase.change-log=pos_liquidbase/db-changelog-master.xml

# Enable Foreign Function & Memory API native access (for potential Panama use)
quarkus.package.jar.manifest.attributes."Enable-Native-Access"=ALL-UNNAMED

# ── Dev Mode ──────────────────────────────────────────────────────────────────
%dev.quarkus.log.level=INFO
%dev.quarkus.log.category."com.openbravo".level=DEBUG
%dev.quarkus.log.category."io.quarkiverse.desktop".level=DEBUG
