# ==============================================================================
# KRIOLOS POS - SPECTRUM DESIGN SYSTEM SYSTEM TOKENS (LIGHT VARIANT)
# ==============================================================================
# Parent architecture inheritance
@parent=com.formdev.flatlaf.FlatLightLaf

# ------------------------------------------------------------------------------
# 1. CORE PALETTE & MATERIALITY (Adobe Spectrum Light Analogy)
# ------------------------------------------------------------------------------
@accentColor=#1473E6
@backgroundColor=#FFFFFF
@foregroundColor=#2C2C2C

# Surface containers & panels
@background=#F5F5F5
@foreground=#222222

# Selection states (High contrast clear selection for active cashiers)
@selectionBackground=#D2E3F7
@selectionForeground=#1473E6

# Component state feedback
Component.focusWidth=1
Component.innerFocusWidth=0
Component.focusColor=#1473E6

# ------------------------------------------------------------------------------
# 2. GEOMETRY & TARGET SCALES (High Density Optimization)
# ------------------------------------------------------------------------------
# Geometries match perfectly between dark and light themes for spatial consistency
Button.arc=2
Component.arc=2
CheckBox.arc=2
ComboBox.arc=2
ProgressBar.arc=2
ScrollBar.arc=2

# Padding configurations 
Button.margin=6,14,6,14
ToggleButton.margin=6,14,6,14
TextField.margin=4,8,4,8

# ------------------------------------------------------------------------------
# 3. COMPONENT INTERFACES
# ------------------------------------------------------------------------------
# Main Sales Grid (JTable customization for checkout lanes)
Table.rowHeight=32
Table.showHorizontalLines=true
Table.showVerticalLines=false
Table.gridColor=#EAEAEA
Table.background=#FFFFFF
Table.foreground=#2C2C2C
Table.alternateRowColor=#F9F9F9

# Scrollbars 
ScrollBar.width=12
ScrollBar.thumbArc=2

# ------------------------------------------------------------------------------
# 4. ALARM MODAL & DESTRUCTIVE ACTIONS (E.g., Void Receipt, Cancel Item)
# ------------------------------------------------------------------------------
Button.destructive.background=#D31414
Button.destructive.foreground=#FFFFFF
Button.destructive.hoverBackground=#BC1010
Button.destructive.focusedBackground=#A50D0D
Button.destructive.pressedBackground=#8E0A0A

# ------------------------------------------------------------------------------
# 5. DISABLED STATES (Visual separation for inactive POS controls)
# ------------------------------------------------------------------------------
# Subtle grays that provide clear indication of inactivity without looking disabled by error
Component.disabledBackground=#EFEFEF
Component.disabledBorderColor=#D1D1D1

# Text color for disabled elements (Ensuring readability in brightly lit retail environments)
TextComponent.disabledText=#8B8B8B
Button.disabledText=#8B8B8B
Button.disabledBackground=#EAEAEA
Label.disabledForeground=#8B8B8B

# ------------------------------------------------------------------------------
# 6. TABBED PANES (Category Navigation for Touch & Mouse)
# ------------------------------------------------------------------------------
# Keeping the 44px touch targets consistent with the dark theme
TabbedPane.tabHeight=44
TabbedPane.tabInsets=8,20,8,20

# Light theme tab indicators
TabbedPane.showTabSeparators=true
TabbedPane.tabSeparatorsColor=#EAEAEA
TabbedPane.underlineColor=#1473E6
TabbedPane.underlineHeight=3

# Tab state colors optimized for the light #FFFFFF / #F5F5F5 surfaces
TabbedPane.background=#FFFFFF
TabbedPane.foreground=#2C2C2C
TabbedPane.selectedBackground=#F5F5F5
TabbedPane.selectedForeground=#111111
TabbedPane.hoverColor=#F0F0F0
TabbedPane.focusColor=#1473E6

# ------------------------------------------------------------------------------
# 7. COMBOBOX & POPUPS (E.g., Customer Selection, Tax Modes)
# ------------------------------------------------------------------------------
# Consistent padding and dropdown arrow styling
ComboBox.padding=4,8,4,8
ComboBox.buttonStyle=mac
ComboBox.selectionBackground=#D2E3F7
ComboBox.selectionForeground=#1473E6
ComboBox.buttonSeparatorWidth=1
ComboBox.buttonSeparatorColor=#EAEAEA

# ------------------------------------------------------------------------------
# 8. DIALOGS & ALERTS (JOptionPane for Confirms / Void Auth)
# ------------------------------------------------------------------------------
# Elevated modal surface (#FFFFFF) to contrast against main application panels
OptionPane.background=#FFFFFF
OptionPane.messageForeground=#2C2C2C

# Retaining the spacious 24px padding for high-stress confirmation dialogs
OptionPane.border=24,24,16,24
OptionPane.messageAreaBorder=0,0,16,0
OptionPane.buttonAreaBorder=16,0,0,0

# Custom window title bars 
TitlePane.background=#FFFFFF
TitlePane.foreground=#2C2C2C
TitlePane.inactiveBackground=#F5F5F5
TitlePane.inactiveForeground=#8B8B8B