# ==============================================================================
# KRIOLOS POS - SPECTRUM DESIGN SYSTEM SYSTEM TOKENS (DARKEST VARIANT)
# ==============================================================================
# Parent architecture inheritance
@parent=com.formdev.flatlaf.FlatDarkLaf

# ------------------------------------------------------------------------------
# 1. CORE PALETTE & MATERIALITY (Adobe Spectrum Darkest Analogy)
# ------------------------------------------------------------------------------
@accentColor=#1473E6
@backgroundColor=#1B1B1B
@foregroundColor=#F5F5F5

# Surface containers & panels (E.g., Cart View panel, Sidebar summary)
@background=#222222
@foreground=#EAEAEA

# Selection states (High visibility for item lines on data grids)
@selectionBackground=#103A6B
@selectionForeground=#FFFFFF

# Component state feedback
Component.focusWidth=1
Component.innerFocusWidth=0
Component.focusColor=#1473E6

# ------------------------------------------------------------------------------
# 2. GEOMETRY & TARGET SCALES (High Density Optimization)
# ------------------------------------------------------------------------------
# Flat/Sharp look (2px radius) to fit maximum items per screen on POS terminals
Button.arc=2
Component.arc=2
CheckBox.arc=2
ComboBox.arc=2
ProgressBar.arc=2
ScrollBar.arc=2

# Padding configurations for high-density readability
Button.margin=6,14,6,14
ToggleButton.margin=6,14,6,14
TextField.margin=4,8,4,8

# ------------------------------------------------------------------------------
# 3. COMPONENT INTERFACES
# ------------------------------------------------------------------------------
# Main Sales Grid (JTable customization for checkout lanes)
Table.rowHeight=32
Table.showHorizontalLines=true
Table.showVerticalLines=false
Table.gridColor=#2D2D2D
Table.background=#1B1B1B
Table.foreground=#F5F5F5
Table.alternateRowColor=#222222

# Scrollbars (Wider track for easier touch interaction if touchscreen is deployed)
ScrollBar.width=12
ScrollBar.thumbArc=2

# ------------------------------------------------------------------------------
# 4. ALARM MODAL & DESTRUCTIVE ACTIONS (E.g., Void Receipt, Cancel Item)
# ------------------------------------------------------------------------------
Button.destructive.background=#E63946
Button.destructive.foreground=#FFFFFF
Button.destructive.hoverBackground=#C82333
Button.destructive.focusedBackground=#B21F2D
Button.destructive.pressedBackground=#9A1A25


# ------------------------------------------------------------------------------
# 5. DISABLED STATES (Visual separation for inactive POS controls)
# ------------------------------------------------------------------------------
# Muted grays that maintain readability but clearly indicate an inactive state
Component.disabledBackground=#262626
Component.disabledBorderColor=#323232

# Text color for disabled elements (WCAG compliant contrast against #262626)
TextComponent.disabledText=#7A7A7A
Button.disabledText=#7A7A7A
Button.disabledBackground=#2A2A2A
Label.disabledForeground=#7A7A7A

# ------------------------------------------------------------------------------
# 6. TABBED PANES (Category Navigation for Touch & Mouse)
# ------------------------------------------------------------------------------
# Taller tabs (44px) make excellent touch targets for switching product categories
TabbedPane.tabHeight=44
TabbedPane.tabInsets=8,20,8,20

# Spectrum-style underline indicator for the active tab
TabbedPane.showTabSeparators=true
TabbedPane.tabSeparatorsColor=#2D2D2D
TabbedPane.underlineColor=#1473E6
TabbedPane.underlineHeight=3

# Tab state colors
TabbedPane.background=#1B1B1B
TabbedPane.foreground=#EAEAEA
TabbedPane.selectedBackground=#222222
TabbedPane.selectedForeground=#F5F5F5
TabbedPane.hoverColor=#2A2A2A
TabbedPane.focusColor=#1473E6

# ------------------------------------------------------------------------------
# 7. COMBOBOX & POPUPS (E.g., Customer Selection, Tax Modes)
# ------------------------------------------------------------------------------
# Consistent padding and clear separation for the dropdown arrow
ComboBox.padding=4,8,4,8
ComboBox.buttonStyle=mac
ComboBox.selectionBackground=#103A6B
ComboBox.selectionForeground=#FFFFFF
ComboBox.buttonSeparatorWidth=1
ComboBox.buttonSeparatorColor=#2D2D2D

# ------------------------------------------------------------------------------
# 8. DIALOGS & ALERTS (JOptionPane for Confirms / Void Auth)
# ------------------------------------------------------------------------------
# Elevated surface background (#222222) to lift dialogs off the main window
OptionPane.background=#222222
OptionPane.messageForeground=#F5F5F5

# Spacious padding prevents text from feeling cramped in high-stress POS moments
OptionPane.border=24,24,16,24
OptionPane.messageAreaBorder=0,0,16,0
OptionPane.buttonAreaBorder=16,0,0,0

# Custom window title bars (if you are using FlatLaf custom window decorations)
TitlePane.background=#1B1B1B
TitlePane.foreground=#F5F5F5
TitlePane.inactiveBackground=#1B1B1B
TitlePane.inactiveForeground=#7A7A7A